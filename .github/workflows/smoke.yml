name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # The VM test needs KVM, so this must be an x86_64 Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Allow the runner user to use /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run the smoke test in a NixOS VM
        run: nix build '.#checks.x86_64-linux.smoke-observability' --print-build-logs
